# Sensor fusion: wheel odometry (forward speed) + IMU gyro (yaw rate).
# Skid-steer wheels slip when turning, so wheel-based yaw rate is poor;
# the gyro is much better for heading. Order of the 15 flags:
#   x y z | roll pitch yaw | vx vy vz | vroll vpitch vyaw | ax ay az
ekf_filter_node:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0
    sensor_timeout: 0.2
    two_d_mode: true
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    odom0: /odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, false,
                   false, false, false]
    odom0_differential: false
    odom0_queue_size: 10

    imu0: /imu/data
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_queue_size: 20
    imu0_remove_gravitational_acceleration: false
